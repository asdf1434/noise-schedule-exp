# Control for arm 2 of gt_target.conf: the class-conditional model trained on
# the unconditional target, so arm 2 against this compares targets on the same
# model. Submitted after gt_target:
#
#     scripts/slurm/submit.sh --after <gt_target train job> gt_target_control train
#     scripts/slurm/submit.sh --after <gt_target merge job>:<this train job> gt_target_control eval_prep eval merge

SEEDS=10
TIME=03:00:00

EVAL_DATASETS=(mnist_x0.1 mnist mnist_x10 cifar10_x0.1 cifar10 cifar10_x10)
EVAL_SHARDS=16

CONFIGS=(
  '--dataset mnist_x0.1 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset mnist --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0}'
  '--dataset mnist_x10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
  '--dataset cifar10_x0.1 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset cifar10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0}'
  '--dataset cifar10_x10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
)
