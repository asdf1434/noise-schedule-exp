# ==========================================
# Q2 conditioning sweep: mnist with --conditioning lowres, the same 6
# training distributions x 20 seeds used for this dataset's cond-none sweep.
# MNIST is 28x28, same time budget as its cond-none exp1/2 runs.
#
# Does NOT need any new real-image reference set or cached FID stats --
# those are dataset-scoped (already produced by the cond-none phase's
# generate_real_samples.py / cache_real_stats.py runs) and conditioning's
# eval_ref_images come straight from the training dataloader itself
# (train.py withholds up to 1000 images from training for this).
#
# Job array: 120 independent tasks (SLURM_ARRAY_TASK_ID 0..119), one per
# (train_dist, seed) combo -- 6 distributions x 20 seeds each -- running in
# PARALLEL across GPUs:
#   uniform, logit_normal(mu=0,sigma=1), logit_normal_peaked(sigma=0.3),
#   logit_normal_skew_hi(mu=1.5), logit_normal_skew_lo(mu=-1.5), plateau
# 120 tasks concurrently needs more GPUs than a small pilot -- if the
# lab-free QOS/partition pool can't grant that many at once, add a
# concurrency cap by changing --array=0-119 to e.g. --array=0-119%20.
#
# After ALL 120 tasks finish, no new eval pipeline is needed either --
# the existing run_exp1_eval*.sh chain already scores every
# experiment under this dataset regardless of conditioning (evaluate_fid.py
# filters by dataset only). Just re-run:
#   sbatch scripts/slurm/run_exp1_eval_array.sh   (after stats are cached)
#   sbatch --dependency=afterok:<ARRAY_JOBID> scripts/slurm/run_exp1_eval_merge.sh
# ==========================================

# Generated from the former scripts/slurm/run_mnist_lowres.sh.

SEEDS=20
TIME=03:00:00

# Datasets this experiment's FID stage scores, and its shard count.
EVAL_DATASETS=(mnist)
EVAL_SHARDS=64

# One entry per training configuration; the array runs each with every seed,
# array index = config_index * SEEDS + seed.
CONFIGS=(
  '--dataset mnist --conditioning lowres --train_dist uniform'
  '--dataset mnist --conditioning lowres --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning lowres --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset mnist --conditioning lowres --train_dist logit_normal --dist_params {"mu":1.5,"sigma":1.0}'
  '--dataset mnist --conditioning lowres --train_dist logit_normal --dist_params {"mu":-1.5,"sigma":1.0}'
  '--dataset mnist --conditioning lowres --train_dist plateau_logit_normal --dist_params {"mu":0.0,"sigma":1.0,"uniform_prob":0.3}'
)
