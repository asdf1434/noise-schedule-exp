# ==========================================
# Fix the estimator grid: sigma_max must NOT scale with the data.
#
# THE BUG. Every scaled InfoNoise arm so far used grid = k * [0.002, 80],
# scaling BOTH ends with the data scale k (the rule introduced in
# gridscale.conf). Scaling sigma_min is right: the low-noise end is about
# resolving detail in the data, which does scale with k. Scaling sigma_max is
# wrong. At t -> 0 the noisy image is z = (1 - t) * eps, unit-variance noise
# regardless of k, so the high-noise end of the trajectory is scale-free.
#
# It matters because InfoNoise draws t = 1/(1 + sigma) strictly inside its
# grid, so sigma_max is a hard floor on the t it can ever train at, while the
# sampler always starts at t = 0:
#
#   cell          grid           t_min trained   steps of 50 below it   FID
#   mnist         [0.002, 80]       0.0123            1/50              13.9
#   mnist_x10     [0.02, 800]       0.0012            1/50              17.9
#   mnist_x0.1    [0.0002, 8]       0.1111            6/50              45.5
#   cifar10       [0.002, 80]       0.0123            1/50              77.3
#   cifar10_x10   [0.02, 800]       0.0012            1/50              77.4
#   cifar10_x0.1  [0.0002, 8]       0.1111            6/50             129.5
#
# The two cells that never train on the first 12% of the sampling trajectory
# are the only two outliers, on two independent datasets. The fixed
# logit-normal arms are unaffected: sigmoid(mu + z) has unbounded support in t,
# so there is no wall, only a thin tail -- which is why the k = 0.1 centre
# sweeps are healthy (best FID 14.0) while InfoNoise on the same data is 45.5.
#
# Ruled out first, on the same runs: placement (changing t_clip moved the median
# training sigma/k by 16x, from 0.25 to 4.01, and FID moved 43.1 -> 45.5, i.e.
# not at all); instability (the k = 0.1 profile is the MOST stable of the four,
# sd of log10 median = 0.073 against 0.114 at k = 1); dead-zone mass (2.8%,
# versus 2.5% at k = 1).
#
# THE CORRECTED RULE:  grid = [0.002 * k, 80].
#
# ARMS (4 x 10 seeds = 40 tasks). The two k = 1 cells are deliberately NOT
# rerun: their grid is already [0.002, 80] under both the old rule and the new
# one, so a rerun would reproduce the existing runs seed for seed.
#
#   0-9    mnist_x0.1    [0.0002, 80]  was [0.0002, 8]    <- the bug
#   10-19  cifar10_x0.1  [0.0002, 80]  was [0.0002, 8]    <- the bug
#   20-29  mnist_x10     [0.02, 80]    was [0.02, 800]    <- over-coverage
#   30-39  cifar10_x10   [0.02, 80]    was [0.02, 800]    <- over-coverage
#
# The x10 arms are not broken -- 800 over-covers rather than truncates, and
# those cells currently score well. They are rerun so all six cells share one
# grid rule, which is what makes the six-cell table a like-for-like comparison.
#
# PREDICTION, WRITTEN BEFORE RUNNING: the x0.1 cells improve substantially
# (mnist_x0.1 from 45.5 toward the mid-teens, where its tuned optimum sits at
# 14.0); the x10 cells move little in either direction. If x0.1 does not
# improve, the truncation is not the cause and the k = 0.1 failure is still open.
#
# t_clip follows the existing convention: 0.005 at k = 0.1 so the loss weight's
# dead zone sits at 0.05k, matching k = 1's relative position; 0.05 elsewhere.
#
#   scripts/slurm/submit.sh infonoise_gridfix
# ==========================================

SEEDS=10
TIME=03:00:00

# Datasets this experiment's FID stage scores, and its shard count.
EVAL_DATASETS=(mnist_x0.1 cifar10_x0.1 mnist_x10 cifar10_x10)
EVAL_SHARDS=16

# One entry per training configuration; the array runs each with every seed,
# array index = config_index * SEEDS + seed.
CONFIGS=(
  '--dataset mnist_x0.1 --train_dist infonoise --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset cifar10_x0.1 --train_dist infonoise --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset mnist_x10 --train_dist infonoise --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
  '--dataset cifar10_x10 --train_dist infonoise --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
)
