# ==========================================
# Does giving the model more help shrink the sampling schedule's benefit?
#
# The July result was that inpaint conditioning and the coarse step spacing seem
# to "buy the same thing": on Fashion-MNIST the coarse spacing gained LEAST from
# adding conditioning (-36%) while the fine spacing gained most (-56%), as if
# both were fixing the same problem and the second one you add is worth less.
#
# If that's real, it should be a smooth trade rather than a coincidence: the
# more help the model gets, the less the step spacing should matter. You can't
# see that by turning conditioning on and off -- you have to vary how MUCH it
# gives, which is what this sweep does.
#
#   class                     just the digit label -- tiny hint, but a strong one
#   inpaint known_fraction    0.25 / 0.75 of the image handed over
#                             (0.5 already exists from the earlier sweep)
#   lowres factor             2 / 4 / 7 -- a blocky preview at 14x14, 7x7, 4x4
#
# Prediction being tested: the coarse spacing's advantage shrinks monotonically
# as the amount of help goes up.
#
# Only 3 training distributions, not the usual 6 -- see run_fashion_sizes.sh.
#
# Job array: 180 tasks = 6 variants x 3 distributions x 10 seeds.
#   variant_idx = ID / 30,  dist_idx = (ID % 30) / 10,  seed = ID % 10
# Cap concurrency if the pool can't grant 180 at once: --array=0-179%20
#
# NEEDS NOTHING FIRST: every variant is plain MNIST, so it reuses the existing
# data/real + cached mnist_real stats. Conditioning is a property of the model,
# not of the images FID scores against.
#
# AFTER: score with the existing mnist chain, which picks these up automatically
# (evaluate_fid.py filters by dataset only, not by conditioning):
#   python scripts/monitor/seed_fid_shards.py --dataset mnist --num_shards 64
#   sbatch scripts/slurm/run_exp1_eval_array.sh
#   sbatch --dependency=afterok:<JOBID> scripts/slurm/run_exp1_eval_merge.sh
# ==========================================

# Generated from the former scripts/slurm/run_mnist_conditioning.sh.

SEEDS=10
TIME=03:00:00

# Datasets this experiment's FID stage scores, and its shard count.
EVAL_DATASETS=(mnist)
EVAL_SHARDS=64

# One entry per training configuration; the array runs each with every seed,
# array index = config_index * SEEDS + seed.
CONFIGS=(
  '--dataset mnist --conditioning class --cond_params {} --train_dist uniform'
  '--dataset mnist --conditioning class --cond_params {} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning class --cond_params {} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset mnist --conditioning inpaint --cond_params {"known_fraction":0.25} --train_dist uniform'
  '--dataset mnist --conditioning inpaint --cond_params {"known_fraction":0.25} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning inpaint --cond_params {"known_fraction":0.25} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset mnist --conditioning inpaint --cond_params {"known_fraction":0.75} --train_dist uniform'
  '--dataset mnist --conditioning inpaint --cond_params {"known_fraction":0.75} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning inpaint --cond_params {"known_fraction":0.75} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset mnist --conditioning lowres --cond_params {"factor":2} --train_dist uniform'
  '--dataset mnist --conditioning lowres --cond_params {"factor":2} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning lowres --cond_params {"factor":2} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset mnist --conditioning lowres --cond_params {"factor":4} --train_dist uniform'
  '--dataset mnist --conditioning lowres --cond_params {"factor":4} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning lowres --cond_params {"factor":4} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset mnist --conditioning lowres --cond_params {"factor":7} --train_dist uniform'
  '--dataset mnist --conditioning lowres --cond_params {"factor":7} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset mnist --conditioning lowres --cond_params {"factor":7} --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
)
