# Does InfoNoise track a data-scale shift once the loss weight stops resisting it?
#
# THE QUESTION. Scaling data by k shifts the optimum by exactly k: with x' = kx
# and y = x + sigma*eps we get y' = k(x + sigma*eps), so
# mmse_k(sigma) = k^2 mmse_1(sigma/k) and rho* is the same shape translated by
# log k. Verified numerically to 1e-13 (scripts/analysis/closed_form_mmse.py
# --verify-scaling). So the learned schedule should move x10 per decade of k.
#
# It does not. Median sigma of InfoNoise's own schedule, 10 seeds:
#
#     mnist    0.411 -> 1.479 -> 2.942     x2.7 per decade   (should be x10)
#     cifar10  0.323 -> 0.792 -> 1.915     x2.4 per decade
#
# WHY WE THINK THE WEIGHT IS AT FAULT. Pushing the exact closed-form target
# through Eq. 13-15 stage by stage, per decade of k:
#
#     mmse peak            x10.0
#     rho*     (Eq. 13)    x10.0
#     after gate (Eq. 14)  x10.2, x9.9
#     pi       (Eq. 15)    x3.6, x5.1        <- dividing by w(sigma)
#
# Exact until Eq. 15 divides by the fixed loss weight w = 1/max(t_clip, 1-t)^2,
# which has landmarks at sigma ~ 0.05 and sigma ~ 1 that do not move with the
# data. At k=0.1 the target sits in the steep 1/sigma^2 stretch and gets pushed
# right; at k=10 it sits where w is nearly flat and barely moves.
#
# THE TEST. --loss_weighting uniform makes w = 1, so Eq. 15 becomes a no-op and
# pi = rho_hat. This is not an ablation: it is InfoNoise's own configuration in
# the paper's shifted-domain experiments (Appendix C.3 -- "INFONOISE also uses
# w(sigma) = 1").
#
# PREDICTION, registered before running. If the loss weight is the obstacle,
# median sigma should move x10 per decade instead of x2.7. Anything still near
# x2.7 means the weight was not the problem and the shortfall is InfoNoise's.
#
# The profile log answers the scaling question during training; the full
# chain runs so FID says whether the samples are actually any good.
#
# NOT COMPARABLE to any existing FID number -- changing w changes the objective.
# Names carry _lw_uniform so nothing collides.
SEEDS=10
TIME=03:00:00
EVAL_DATASETS=(mnist_x0.1 mnist mnist_x10 cifar10_x0.1 cifar10 cifar10_x10)
EVAL_SHARDS=16
CONFIGS=(
  '--dataset mnist_x0.1 --train_dist infonoise --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --loss_weighting uniform --t_clip 0.005'
  '--dataset mnist --train_dist infonoise --dist_params {"sigma_min":0.002,"sigma_max":80.0} --loss_weighting uniform'
  '--dataset mnist_x10 --train_dist infonoise --dist_params {"sigma_min":0.02,"sigma_max":80.0} --loss_weighting uniform'
  '--dataset cifar10_x0.1 --train_dist infonoise --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --loss_weighting uniform --t_clip 0.005'
  '--dataset cifar10 --train_dist infonoise --dist_params {"sigma_min":0.002,"sigma_max":80.0} --loss_weighting uniform'
  '--dataset cifar10_x10 --train_dist infonoise --dist_params {"sigma_min":0.02,"sigma_max":80.0} --loss_weighting uniform'
)
