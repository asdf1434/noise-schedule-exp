# ==========================================
# 1. Slurm Resource Requests
# ==========================================
# Job array: 10 independent tasks (SLURM_ARRAY_TASK_ID 0..9), one per
# (train_dist, seed) combo, running in PARALLEL across GPUs instead of
# sequentially in one long job. Each task only does ONE training run, so
# the per-task time limit only needs to cover a single ~100-epoch run
# (measured ~25s/epoch => ~42 min), not all 10.

# Generated from the former scripts/slurm/run_exp1.sh.

SEEDS=5
TIME=03:00:00

# Datasets this experiment's FID stage scores, and its shard count.
EVAL_DATASETS=(mnist)
EVAL_SHARDS=64

# One entry per training configuration; the array runs each with every seed,
# array index = config_index * SEEDS + seed.
CONFIGS=(
  '--train_dist uniform'
  '--train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
)
