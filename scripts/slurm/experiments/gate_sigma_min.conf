# Does the auto gate measure the data, or the grid?
#
# m_hat is flat over the lowest bins, so r = m_hat/sigma^3 goes as sigma^-3 and
# is monotone decreasing. Its peak therefore always sits on the lowest bin, and
# _resolve_gate_c's threshold crossing (r/peak >= gate_p, gate_p = 0.002) lands at
#
#     c = sigma_lo * gate_p^(-1/3) = 7.94 * sigma_lo
#
# which contains no data at all. Measured c/sigma_min across the six cells is
# 7.3, 8.1, 8.5, 9.0, 10.4 and 13.6 -- consistent, but every one of those runs
# used a grid floor tied to its own data scale, so the two explanations are
# confounded.
#
# This breaks the confound: SAME dataset, same data scale, only sigma_min moves.
# If the gate reads the data, c should barely move. If it reads the grid, c
# moves with sigma_min.
#
# PREDICTIONS, registered before running (bin-0 centre is half a log-bin above
# the grid edge, hence the 1.021 factor at 256 bins over [sigma_min, 80]):
#
#     sigma_min = 0.0002   ->   c ~ 0.00162     (have: none)
#     sigma_min = 0.002    ->   c ~ 0.0162      (have: 0.0207 measured, 10 seeds)
#     sigma_min = 0.02     ->   c ~ 0.162       (have: none)
#
# A flat c across the three kills the claim. A c that tracks sigma_min over two
# decades confirms it.
#
# Training only -- the profile log is written during training, so no FID stage is
# needed. Submit with:  scripts/slurm/submit.sh gate_sigma_min train
SEEDS=5
TIME=03:00:00
EVAL_DATASETS=(mnist)
EVAL_SHARDS=16
CONFIGS=(
  '--dataset mnist --train_dist infonoise --dist_params {"sigma_min":0.0002,"sigma_max":80.0}'
  '--dataset mnist --train_dist infonoise --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
)
