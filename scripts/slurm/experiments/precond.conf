# Does EDM preconditioning fix the flat m_hat?
#
# THE DEFECT. m_hat is flat over the lowest bins of the estimator grid where any
# valid mmse falls as sigma^2 -- measured log-log slope over the lowest decade is
# -0.06 to 0.47 against 1.93-1.96 for the closed form. Because m_hat is flat,
# r = m_hat/sigma^3 is monotone decreasing, its peak always lands on bin 0, and
# _resolve_gate_c's threshold crossing reduces to
#
#     c = sigma_min * gate_p^(-1/3) = 7.94 * sigma_min
#
# with no data in it. Measured c/sigma_min across the six cells: 7.3, 8.1, 8.5,
# 9.0, 10.4, 13.6.
#
# WHY PRECONDITIONING SHOULD FIX IT. Appendix C.2 uses the EDM coefficients with
# sigma_data = 0.5; we did not. With preconditioning c_skip -> 1 and c_out -> 0
# as sigma -> 0, so the denoiser returns its input and the x-space error goes as
# sigma^2 automatically, without the network having to learn to copy. Verified
# at init on an UNTRAINED network: unweighted x-space error at sigma = 0.001 is
# 1.13e-06, i.e. 1.13 * sigma^2.
#
# sigma_data stays at 0.5 and is NOT scaled per dataset. Scaling it would make
# every coefficient rescale so that training at k=10 is a relabelled copy of
# k=1, and the data-scale axis would measure nothing. See src/precond.py.
#
# PREDICTION, registered before running. If preconditioning is the fix:
#   - m_hat's low-decade slope moves from ~0.3 to ~2
#   - gate c stops tracking 7.94 * sigma_min and lands nearer the closed-form
#     target (0.293 on mnist k=1, 0.249 on cifar10 k=1; the paper publishes
#     0.153 for CIFAR-10)
# If the slope stays near 0, preconditioning is not the cause and the larger
# rerun is not worth the GPU time.
#
# Three scales so the scaling question is answered in the same run: with the
# weight replaced by EDM's (which cancels c_out rather than fighting it), the
# schedule should move x10 per decade of k instead of the x2.7 measured under
# vpred.
#
# Training only -- the profile log is written during training, so no FID stage.
# NOT COMPARABLE to any existing FID number: preconditioning changes the network.
# Names carry _lw_edm so nothing collides.
#
#     scripts/slurm/submit.sh precond train
SEEDS=3
TIME=03:00:00
EVAL_DATASETS=(mnist)
EVAL_SHARDS=16
CONFIGS=(
  '--dataset mnist --train_dist infonoise --dist_params {"sigma_min":0.002,"sigma_max":80.0} --loss_weighting edm'
  '--dataset mnist_x0.1 --train_dist infonoise --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --loss_weighting edm'
  '--dataset mnist_x10 --train_dist infonoise --dist_params {"sigma_min":0.02,"sigma_max":80.0} --loss_weighting edm'
  '--dataset cifar10 --train_dist infonoise --dist_params {"sigma_min":0.002,"sigma_max":80.0} --loss_weighting edm'
)
