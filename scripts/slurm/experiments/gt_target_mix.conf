# gt target mixed with the default: each example draws its noise level from
# logit-normal(0, 1) with probability p, otherwise from pi = rho*/w
# (src/gt_target.py, mix_default). The plain gt target leaves out small sigma,
# where the sampler takes its last steps; this puts some of it back.
#
# Short run for a quick answer: 30 epochs, scored at epoch 30 only, on the four
# cells where the plain gt target failed. Compare against the epoch-30 FID of
# the gt_target runs and the default logit-normal runs, which already exist.
#
#     scripts/slurm/submit.sh gt_target_mix train eval merge

SEEDS=3
TIME=01:30:00

EVAL_DATASETS=(mnist mnist_x10 cifar10 cifar10_x10)
EVAL_SHARDS=4
EVAL_TIME=01:00:00
# score only these runs, not every other unscored run of the same datasets
EVAL_MATCH=mix_default

CONFIGS=(
  '--dataset mnist --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0,"mix_default":0.1} --epochs 30 --eval_interval 30'
  '--dataset mnist --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0,"mix_default":0.3} --epochs 30 --eval_interval 30'
  '--dataset mnist_x10 --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0,"mix_default":0.1} --epochs 30 --eval_interval 30'
  '--dataset mnist_x10 --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0,"mix_default":0.3} --epochs 30 --eval_interval 30'
  '--dataset cifar10 --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0,"mix_default":0.1} --epochs 30 --eval_interval 30'
  '--dataset cifar10 --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0,"mix_default":0.3} --epochs 30 --eval_interval 30'
  '--dataset cifar10_x10 --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0,"mix_default":0.1} --epochs 30 --eval_interval 30'
  '--dataset cifar10_x10 --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0,"mix_default":0.3} --epochs 30 --eval_interval 30'
)
