# Train on the ground-truth target pi = rho*/w (src/gt_target.py), built from
# the exact B.4 mmse in results/mmse_b4/. Same sigma range, t_clip and loss
# weight as the InfoNoise runs in infonoise_gridfix.conf.
#
# Three arms per cell:
#   1. unconditional model, unconditional target
#   2. class-conditional model, each example's own class target (per_class)
#   3. class-conditional model, unconditional target (control for arm 2)
#
#     scripts/slurm/submit.sh gt_target

SEEDS=10
TIME=03:00:00

EVAL_DATASETS=(mnist_x0.1 mnist mnist_x10 cifar10_x0.1 cifar10 cifar10_x10)
EVAL_SHARDS=16

CONFIGS=(
  # 1. unconditional model, unconditional target
  '--dataset mnist_x0.1 --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset mnist --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0}'
  '--dataset mnist_x10 --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
  '--dataset cifar10_x0.1 --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset cifar10 --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0}'
  '--dataset cifar10_x10 --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
  # 2. class-conditional model, per-class target
  '--dataset mnist_x0.1 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0,"per_class":true} --t_clip 0.005'
  '--dataset mnist --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0,"per_class":true}'
  '--dataset mnist_x10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0,"per_class":true}'
  '--dataset cifar10_x0.1 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0,"per_class":true} --t_clip 0.005'
  '--dataset cifar10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0,"per_class":true}'
  '--dataset cifar10_x10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0,"per_class":true}'
  # 3. class-conditional model, unconditional target
  '--dataset mnist_x0.1 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset mnist --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0}'
  '--dataset mnist_x10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
  '--dataset cifar10_x0.1 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.0002,"sigma_max":80.0} --t_clip 0.005'
  '--dataset cifar10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.002,"sigma_max":80.0}'
  '--dataset cifar10_x10 --conditioning class --train_dist gt_target --dist_params {"sigma_min":0.02,"sigma_max":80.0}'
)
