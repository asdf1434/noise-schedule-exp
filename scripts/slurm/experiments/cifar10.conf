# ==========================================
# CIFAR-10 counterpart to run_eurosat.sh: the same 6 training distributions
# x 20 seeds, at CIFAR-10's native 32x32 resolution (--dataset cifar10).
# CIFAR-10 is natively RGB; src/datasets.py's get_cifar10_dataloaders
# collapses it to grayscale (same luminance treatment as EuroSAT) so it fits
# the model/conditioning/FID pipeline's single-channel assumption.
#
# Before submitting this for the first time, the cifar10 real-image
# reference set + cached FID stats must exist (one-time, not part of this job):
#   python -m src.generate_real_samples --dataset cifar10 --num_samples 5000
#   python cache_real_stats.py --dataset cifar10   # (run_cifar10_eval.sh does this)
#
# Job array: 120 independent tasks (SLURM_ARRAY_TASK_ID 0..119), one per
# (train_dist, seed) combo -- 6 distributions x 20 seeds each -- running in
# PARALLEL across GPUs:
#   uniform, logit_normal(mu=0,sigma=1), logit_normal_peaked(sigma=0.3),
#   logit_normal_skew_hi(mu=1.5), logit_normal_skew_lo(mu=-1.5), plateau
# 120 tasks concurrently needs more GPUs than a small pilot -- if the
# lab-free QOS/partition pool can't grant that many at once, add a
# concurrency cap by changing --array=0-119 to e.g. --array=0-119%20.
# ==========================================

# Generated from the former scripts/slurm/run_cifar10.sh.

SEEDS=20
TIME=03:00:00

# Datasets this experiment's FID stage scores, and its shard count.
EVAL_DATASETS=(cifar10)
EVAL_SHARDS=64

# One entry per training configuration; the array runs each with every seed,
# array index = config_index * SEEDS + seed.
CONFIGS=(
  '--dataset cifar10 --train_dist uniform'
  '--dataset cifar10 --train_dist logit_normal --dist_params {"mu":0.0,"sigma":1.0}'
  '--dataset cifar10 --train_dist logit_normal --dist_params {"mu":0.0,"sigma":0.3}'
  '--dataset cifar10 --train_dist logit_normal --dist_params {"mu":1.5,"sigma":1.0}'
  '--dataset cifar10 --train_dist logit_normal --dist_params {"mu":-1.5,"sigma":1.0}'
  '--dataset cifar10 --train_dist plateau_logit_normal --dist_params {"mu":0.0,"sigma":1.0,"uniform_prob":0.3}'
)
